services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cadfun
      POSTGRES_PASSWORD: cadfun
      POSTGRES_DB: cadfun
    ports:
      - "5432:5432"
    volumes:
      - cadfun_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadfun -d cadfun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadfun_pg:
